name: Feature request
description: Propose a focused improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and distribution impact
      description: Note new permissions, network services, downloads, credentials, executable code, or dependencies.
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution interest
      description: Would you be interested in implementing this after scope agreement?
      options:
        - Yes, with maintainer guidance
        - Yes, independently
        - No, suggestion only
    validations:
      required: true
