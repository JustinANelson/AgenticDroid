name: Native release closure

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/assets/native-overrides/**"
      - "gradle/libs.versions.toml"
      - "tools/*_native_libs_manifest.json"
      - "tools/build_*.py"
      - "tools/fetch_*.py"
      - "tools/openjdk_launcher/**"
      - ".github/workflows/release-closure.yml"

permissions:
  contents: read

concurrency:
  group: native-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reconstruct native closure and assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK platform and NDK
        run: sdkmanager --install "platforms;android-37" "ndk;27.2.12479018"
      - name: Cache native closure
        id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: native-libs-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'tools/*.json', 'tools/openjdk_launcher/*.patch', 'tools/fetch_native_libs.py', 'tools/fetch_python_native_libs.py', 'tools/fetch_jvm_native_libs.py', 'tools/build_openjdk_launcher.py', 'tools/build_libtermux.py') }}
      - name: Fetch and build native closure
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          python3 tools/fetch_native_libs.py
          python3 tools/fetch_python_native_libs.py
          python3 tools/fetch_jvm_native_libs.py
          python3 tools/build_libtermux.py
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Assemble unsigned release artifact
        run: ./gradlew assembleRelease --stacktrace
