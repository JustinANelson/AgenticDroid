name: Build versioned development APK

on:
  push:
    branches:
      - master
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:
    inputs:
      publish:
        description: Build the current version as a development artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: development-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and provide development APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect major or minor version change
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_REF: ${{ github.event.before }}
          AFTER_REF: ${{ github.sha }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_PUBLISH" != "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+(\.[0-9]+)?)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
            code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
            test -n "$version"
            test -n "$code"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "version_code=$code" >> "$GITHUB_OUTPUT"
          else
            python3 tools/version_change.py \
              --before "$BEFORE_REF" \
              --after "$AFTER_REF" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Stop when this is not a development release
        if: steps.version.outputs.publish != 'true'
        run: echo "No major/minor version change; no development APK will be built."

      - name: Require a dated changelog section
        if: steps.version.outputs.publish == 'true' && github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Eq "^## \\[${VERSION//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain: ## [$VERSION] - YYYY-MM-DD" >&2
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Set up Android SDK tools
        if: steps.version.outputs.publish == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK platform and NDK
        if: steps.version.outputs.publish == 'true'
        run: sdkmanager --install "platforms;android-37" "ndk;27.2.12479018" --channel=3

      - name: Cache native closure
        if: steps.version.outputs.publish == 'true'
        id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: native-libs-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'tools/*.json', 'tools/openjdk_launcher/*.patch', 'tools/fetch_native_libs.py', 'tools/fetch_python_native_libs.py', 'tools/fetch_jvm_native_libs.py', 'tools/build_openjdk_launcher.py', 'tools/build_libtermux.py') }}

      - name: Reconstruct native runtime closure
        if: steps.version.outputs.publish == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          python3 tools/fetch_native_libs.py
          python3 tools/fetch_python_native_libs.py
          python3 tools/fetch_jvm_native_libs.py
          python3 tools/build_libtermux.py

      - name: Configure stable development signing when available
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          DEVELOPMENT_KEYSTORE: ${{ secrets.AGENTICDROID_DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEVELOPMENT_KEYSTORE" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEVELOPMENT_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo "::warning::AGENTICDROID_DEVELOPMENT_KEYSTORE_BASE64 is not configured. This build will use an ephemeral debug certificate and will not update earlier CI builds."
          fi

      - name: Set up Gradle and validate the wrapper
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Validate repository and companion server
        if: steps.version.outputs.publish == 'true'
        run: |
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          npm --prefix tools ci
          npm --prefix tools test
          npm --prefix tools audit --omit=dev

      - name: Test, lint, and build debug APK
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify and name APK
        if: steps.version.outputs.publish == 'true'
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          source_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          output_dir="$RUNNER_TEMP/development-release"
          output_apk="$output_dir/AgenticDroid-${VERSION}-development-arm64-v8a.apk"
          test -n "$source_apk"
          test -n "$apksigner"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"
          "$apksigner" verify --verbose --print-certs "$output_apk" | tee "$output_dir/signature.txt"
          (cd "$output_dir" && sha256sum "$(basename "$output_apk")") > "$output_apk.sha256"
          echo "directory=$output_dir" >> "$GITHUB_OUTPUT"
          echo "apk=$output_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$output_apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AgenticDroid-${{ steps.version.outputs.version }}-development-arm64-v8a
          path: ${{ steps.artifact.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30
